name: Desplegar Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar la app
        working-directory: frontend
        run: npm run build

      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Desplegar archivos al servidor con rsync
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          sshpass -p "$SERVER_PASSWORD" rsync -avz --delete \
            -e "ssh -p 22002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            frontend/dist/ \
            "$SERVER_USER@$SERVER_HOST:~/public_html/"

      - name: Confirmar despliegue
        run: echo "Despliegue completado exitosamente"
