name: Desplegar Frontend

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          cd frontend
          npm ci

      - name: Compilar la app
        run: |
          cd frontend
          npm run build

      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Desplegar archivos al servidor (pipeline directo)
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          tar -czf - -C frontend/dist . | \
          sshpass -p "$SERVER_PASSWORD" ssh -p 22002 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo rm -rf /var/www/html/* && sudo tar -xzf - -C /var/www/html/ && sudo systemctl restart nginx && echo 'Despliegue completado'"
